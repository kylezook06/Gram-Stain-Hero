<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MicroBuddyz Gram Stain Hero</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fdf7f2;
      font-family: 'Helvetica Neue', Arial, sans-serif;

      align-items: center;
      color: #2d2d2d;
    }
    header {
      margin-top: 16px;
      text-align: center;

<body>
  <header>
    <h1>MicroBuddyz Gram Stain Hero</h1>
    <p>Step through crystal violet → iodine → a timing-based decolorizer rinse → safranin, then jump to the microscope to see how many MicroBuddyz you stained correctly.</p>
