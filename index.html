<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MicroBuddyz Gram Stain Hero</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f2efe9;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #2d2d2d;
    }
    header {
      margin-top: 16px;
      text-align: center;
    }
    header h1 {
      margin: 0 0 6px 0;
      font-size: 28px;
      letter-spacing: 0.5px;
    }
    header p {
      margin: 0;
      font-size: 15px;
      color: #4a4a4a;
    }
    #canvas-container {
      margin: 12px auto 24px auto;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      overflow: hidden;
    }
    footer {
      margin-bottom: 20px;
      color: #666;
      font-size: 13px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="sketch.js"></script>
</head>
<body>
  <header>
    <h1>MicroBuddyz Gram Stain Hero</h1>
    <p>Tap the reagent bottle buddies in order to stain the cells like a real lab slide.</p>
  </header>
  <div id="canvas-container"></div>
  <footer>Starter sketch: smear is ready and heat-fixed — choose a reagent to begin staining.</footer>
</body>
</html>
